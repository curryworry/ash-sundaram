backend:
  name: github
  repo: curryworry/ash-sundaram
  branch: main

site_url: https://ashsundaram.com
display_url: https://ashsundaram.com
logo_url: /favicon.svg

media_folder: public/images
public_folder: /images

collections:
  - name: blog
    label: Blog
    label_singular: Blog Post
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview_path: blog/{{slug}}
    sortable_fields:
      - pubDate
      - title
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Publish Date
        name: pubDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: Hero Image
        name: heroImage
        widget: image
        required: false
      - label: Categories
        name: categories
        widget: list
        required: false
        field:
          label: Category
          name: category
          widget: string
      - label: Tags
        name: tags
        widget: list
        required: false
        field:
          label: Tag
          name: tag
          widget: string
      - label: Draft
        name: draft
        widget: boolean
        required: false
        default: false
      - label: Body
        name: body
        widget: markdown
